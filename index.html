<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>زهرة كلينك - قريبًا</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#ff4fa8 0%,#1a0011 35%,#000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* خلفية متحركة */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#ff4fa866 1px,transparent 1px);
    background-size:40px 40px;
    animation:moveStars 20s linear infinite;
    opacity:.4;
}

@keyframes moveStars{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

/* Glow */
.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#ff1f8f;
    border-radius:50%;
    filter:blur(120px);
    opacity:.18;
}

/* الكارت */
.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:700px;
    padding:50px 35px;
    border-radius:35px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12);
    text-align:center;
    box-shadow:
    0 0 40px rgba(255,0,128,.25),
    inset 0 0 20px rgba(255,255,255,.05);
    animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo-circle{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    border:2px solid #ff5eb7;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    color:#ff79c6;
    box-shadow:0 0 25px #ff3c9c;
    margin-bottom:25px;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 15px #ff3c9c;}
    50%{box-shadow:0 0 35px #ff3c9c;}
    100%{box-shadow:0 0 15px #ff3c9c;}
}

h1{
    color:#fff;
    font-size:65px;
    font-weight:900;
    line-height:1.2;
    text-shadow:0 0 25px rgba(255,80,170,.8);
}

h1 span{
    color:#ff6ec7;
}

.subtitle{
    margin-top:18px;
    color:#ffd5ea;
    font-size:26px;
    font-weight:600;
}

.loading{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:12px;
}

.loading span{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#ff5eb7;
    animation:bounce 1.2s infinite;
}

.loading span:nth-child(2){
    animation-delay:.2s;
}

.loading span:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:scale(.5);
        opacity:.4;
    }
    40%{
        transform:scale(1.3);
        opacity:1;
    }
}

.status{
    margin-top:30px;
    color:#fff;
    font-size:22px;
    line-height:2;
}

.status strong{
    color:#ff7cc9;
}

.bottom{
    margin-top:35px;
    color:#ffc9e6;
    font-size:18px;
    opacity:.9;
}

.spark{
    position:absolute;
    color:#ff90d2;
    font-size:22px;
    animation:float 6s infinite ease-in-out;
}

.spark:nth-child(1){top:10%;left:15%;}
.spark:nth-child(2){top:20%;right:18%;}
.spark:nth-child(3){bottom:18%;left:20%;}
.spark:nth-child(4){bottom:10%;right:15%;}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

@media(max-width:768px){

h1{
    font-size:48px;
}

.subtitle{
    font-size:22px;
}

.container{
    padding:40px 25px;
}

}
</style>
</head>

<body>

<div class="glow"></div>

<div class="spark">✨</div>
<div class="spark">💖</div>
<div class="spark">✨</div>
<div class="spark">🌸</div>

<div class="container">

    <div class="logo-circle">
        ♡
    </div>

    <h1>
        انتظروا <br>
        <span>زهرة كلينك</span>
    </h1>

    <div class="subtitle">
        عالم جديد من الجمال والعناية ✨
    </div>

    <div class="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="status">
        🚧 <strong>تحت الإنشاء</strong><br>
        💻 جارى العمل على تجربة مختلفة تليق بجمالك<br>
        🎀 مفاجآت وعروض قوية جدًا فى الطريق
    </div>

    <div class="bottom">
        قريبًا جدًا ... هتشوفوا حاجة مختلفة 💖
    </div>

</div>

</body>
</html>
